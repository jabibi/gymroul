apply plugin: 'com.android.application'

// Única fuente de la versión: package.json (version, versionCode y versionCodename)
def appPackage = new groovy.json.JsonSlurper().parse(file('../../package.json'))
['version', 'versionCode', 'versionCodename'].each { field ->
    if (appPackage[field] == null) {
        throw new GradleException("Missing '${field}' in package.json: it is the single source of the app version")
    }
}
if (!(appPackage.version ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("Invalid 'version' in package.json: '${appPackage.version}' (expected MAJOR.MINOR.PATCH, e.g. 1.10.0)")
}
def (versionMajor, versionMinor) = appPackage.version.tokenize('.')

android {
    namespace = "eus.jabibi.gymroul"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "eus.jabibi.gymroul"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appPackage.versionCode
        versionName "${versionMajor}.${versionMinor} (${appPackage.versionCodename})"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Firma de release: opcional y fuera del repositorio. Se lee de ~/.gradle/gradle.properties (o de la línea de órdenes con -P),
    // así que vale igual desde Android Studio que desde la terminal. Sin esas propiedades, la release sale sin firmar (como en la CI).
    //   GYMROUL_KEYSTORE_FILE=/ruta/al/keystore.jks
    //   GYMROUL_KEYSTORE_PASSWORD=...
    //   GYMROUL_KEY_ALIAS=...
    //   GYMROUL_KEY_PASSWORD=...
    def signingProps = ['GYMROUL_KEYSTORE_FILE', 'GYMROUL_KEYSTORE_PASSWORD', 'GYMROUL_KEY_ALIAS', 'GYMROUL_KEY_PASSWORD']
    def signingSet = signingProps.findAll { project.hasProperty(it) }
    def hasSigning = signingSet.size() == signingProps.size() && file(project.property('GYMROUL_KEYSTORE_FILE')).exists()
    if (signingSet && !hasSigning) {
        // Hay propiedades de firma, pero no sirven (faltan unas o el keystore no existe): la release saldría sin firmar sin que nadie lo notara.
        // Se avisa siempre y, si se compila una release, se para.
        def why = signingSet.size() < signingProps.size() ? "faltan ${signingProps - signingSet}" : "no existe el keystore ${project.property('GYMROUL_KEYSTORE_FILE')}"
        def signingProblem = "Firma de release mal configurada (gradle.properties): ${why}."
        logger.warn("AVISO: ${signingProblem}")
        project.gradle.taskGraph.whenReady { graph ->
            if (graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package)\w*Release/ }) {
                throw new GradleException("${signingProblem} La release saldría sin firmar.")
            }
        }
    }
    if (hasSigning) {
        signingConfigs {
            release {
                storeFile file(project.property('GYMROUL_KEYSTORE_FILE'))
                storePassword project.property('GYMROUL_KEYSTORE_PASSWORD')
                keyAlias project.property('GYMROUL_KEY_ALIAS')
                keyPassword project.property('GYMROUL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Otra app para Android: se instala al lado de la de Play (que va firmada con otra clave y no se puede pisar)
            // y con sus propios datos. El nombre en el lanzador lo pone src/debug/res/values/strings.xml.
            applicationIdSuffix ".debug"
        }
        release {
            if (hasSigning) signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
